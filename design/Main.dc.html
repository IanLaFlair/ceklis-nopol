<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Ceklis — Login petugas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
input:focus{outline:2px solid #0E100F;outline-offset:1px}
.btn:active{transform:scale(.98)}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #F2F2EE; color: #0E100F; font-family: 'IBM Plex Sans', system-ui, sans-serif">
  <!-- top -->
  <div style="background: #0E100F; color: #F2F2EE; padding: 56px 24px 32px; display: flex; flex-direction: column; gap: 28px; position: relative">
    <div style="display: flex; align-items: center; gap: 10px">
      <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 10px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E100F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4.5 4.5L19 7"/></svg>
      </span>
      <span style="display: flex; flex-direction: column; line-height: 1.1">
        <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 24px; letter-spacing: -0.02em">ceklis</span>
        <span style="font-size: 12px; color: #A3A8A3">by nopol</span>
      </span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 34px; line-height: 1.05; letter-spacing: -0.03em">Checklist valet,<br>cepat &amp; rapi.</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #B4B8B3">Catat kondisi kendaraan saat masuk dan keluar, lengkap dengan foto.</p>
    </div>
  </div>
  <div aria-hidden="true" style="height: 12px; background: repeating-linear-gradient(-45deg, {{accent}} 0 16px, #0E100F 16px 32px)"></div>

  <!-- form -->
  <form style="flex: 1; padding: 28px 24px 24px; display: flex; flex-direction: column; gap: 18px">
    <label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600">ID petugas atau nomor HP
      <input inputmode="tel" placeholder="mis. 0812 3456 7890" style="min-height: 56px; border: 1.5px solid #C9CAC2; border-radius: 12px; padding: 0 16px; font-family: inherit; font-size: 17px; font-weight: 400; background: #FFFFFF">
    </label>
    <label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600">PIN
      <input type="password" inputmode="numeric" maxlength="6" placeholder="6 digit" style="min-height: 56px; border: 1.5px solid #C9CAC2; border-radius: 12px; padding: 0 16px; font-family: 'JetBrains Mono', monospace; font-size: 20px; letter-spacing: 0.3em; background: #FFFFFF">
    </label>
    <a class="btn" href="MHome.dc.html" style="min-height: 58px; border-radius: 14px; background: {{accent}}; color: #0E100F; font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 4px">
      Masuk
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
    <div style="display: flex; align-items: flex-start; gap: 10px; background: #FFFFFF; border: 1px solid #DCDDD6; border-radius: 12px; padding: 14px; font-size: 13px; line-height: 1.5; color: #50554F">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E100F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      Lokasi dan pos tugas (mis. Lobby 2) diatur oleh admin. Hubungi supervisor kalau lokasi kamu salah.
    </div>
    <span style="margin-top: auto; text-align: center; font-size: 12px; color: #6B706A">ceklis.nopol-lpr.com</span>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5C518","options":["#F5C518","#FF8A1F","#B8F53A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#F5C518' };
  }
}
</script>
</body>
</html>
