<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Ceklis — Beranda petugas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
input:focus{outline:2px solid #0E100F;outline-offset:1px}
.btn:active{transform:scale(.98)}
.row:active{background:#F7F7F3}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #F2F2EE; color: #0E100F; font-family: 'IBM Plex Sans', system-ui, sans-serif">
  <!-- header -->
  <header style="background: #0E100F; color: #F2F2EE; padding: 48px 20px 20px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
        <span style="font-size: 12px; color: #A3A8A3">Pakuwon Mall Surabaya</span>
        <button style="display: inline-flex; align-items: center; gap: 6px; background: transparent; border: 0; padding: 0; color: #F2F2EE; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; cursor: pointer">Lobby 2
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <span style="font-size: 13px; color: #A3A8A3">Shift pagi · 07.00–15.00</span>
      </div>
      <a href="Main.dc.html" aria-label="Akun Budi" style="width: 44px; height: 44px; border-radius: 50%; background: #2A2E2B; display: flex; align-items: center; justify-content: center; font-weight: 600">B</a>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="background: #1A1D1B; border: 1px solid #2A2E2B; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; color: {{accent}}">38</span>
        <span style="font-size: 12px; color: #A3A8A3">Masih parkir</span>
      </div>
      <div style="background: #1A1D1B; border: 1px solid #2A2E2B; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700">112</span>
        <span style="font-size: 12px; color: #A3A8A3">Masuk hari ini</span>
      </div>
      <div style="background: #1A1D1B; border: 1px solid #2A2E2B; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700">74</span>
        <span style="font-size: 12px; color: #A3A8A3">Keluar</span>
      </div>
    </div>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 18px">
    <!-- big actions -->
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <a class="btn" href="MCheckin.dc.html" style="min-height: 120px; border-radius: 18px; background: {{accent}}; color: #0E100F; padding: 16px; display: flex; flex-direction: column; justify-content: space-between">
        <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        <span style="display: flex; flex-direction: column"><strong style="font-family: 'Space Grotesk', sans-serif; font-size: 22px">Check In</strong><span style="font-size: 13px">Kendaraan datang</span></span>
      </a>
      <a class="btn" href="MCheckout.dc.html" style="min-height: 120px; border-radius: 18px; background: #0E100F; color: #F2F2EE; padding: 16px; display: flex; flex-direction: column; justify-content: space-between">
        <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M10 6H5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5"/></svg>
        <span style="display: flex; flex-direction: column"><strong style="font-family: 'Space Grotesk', sans-serif; font-size: 22px">Check Out</strong><span style="font-size: 13px; color: #B4B8B3">Kendaraan diminta</span></span>
      </a>
    </div>

    <!-- search -->
    <div style="display: flex; gap: 8px">
      <label style="flex: 1; display: flex; align-items: center; gap: 10px; background: #FFFFFF; border: 1.5px solid #C9CAC2; border-radius: 12px; padding: 0 14px; min-height: 52px">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#50554F" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Cari plat</span>
        <input value="{{q}}" onInput="{{typeQ}}" placeholder="Cari plat nomor" style="flex: 1; min-width: 0; border: 0; outline: 0; font-family: inherit; font-size: 16px; background: transparent">
      </label>
      <button aria-label="Scan QR tiket" style="width: 52px; height: 52px; border-radius: 12px; border: 0; background: #0E100F; color: {{accent}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg>
      </button>
    </div>

    <!-- active list -->
    <section aria-label="Kendaraan aktif" style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 18px">Masih parkir</h2>
        <span style="font-size: 13px; color: #50554F">{{count}} kendaraan</span>
      </div>
      <sc-for list="{{list}}" as="v" hint-placeholder-count="5">
        <a class="row" href="MCheckout.dc.html" style="background: #FFFFFF; border: 1px solid #DCDDD6; border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; min-height: 64px">
          <span style="background: #F4F4F0; border: 2px solid #0E100F; border-radius: 4px; padding: 3px 8px; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 14px; white-space: nowrap">{{v.plate}}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
            <span style="font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{v.car}}</span>
            <span style="font-size: 12px; color: #50554F">Slot {{v.slot}} · masuk {{v.time}}</span>
          </span>
          <sc-if value="{{v.flag}}" hint-placeholder-val="{{ false }}">
            <span style="font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: #FBEDE6; color: #A3440B">Ada catatan</span>
          </sc-if>
        </a>
      </sc-for>
    </section>
  </main>

  <!-- tab bar -->
  <nav aria-label="Menu" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #DCDDD6; padding: 6px 8px 22px">
    <a href="MHome.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; justify-content: center; font-size: 11px; font-weight: 600">
      <span style="width: 48px; height: 28px; border-radius: 999px; background: {{accent}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E100F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9H4z"/></svg></span>Beranda</a>
    <a href="MAktif.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; justify-content: center; font-size: 11px; color: #50554F">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14l-1.5-6a2 2 0 0 0-2-1.5h-7a2 2 0 0 0-2 1.5z"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/></svg>Aktif</a>
    <a href="MRiwayat.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; justify-content: center; font-size: 11px; color: #50554F">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Riwayat</a>
    <a href="MAkun.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; justify-content: center; font-size: 11px; color: #50554F">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Akun</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5C518","options":["#F5C518","#FF8A1F","#B8F53A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: '' };
  }
  renderVals() {
    const all = [
      { plate: 'B 1234 ABC', car: 'Toyota Fortuner · Hitam', slot: 'B2-14', time: '12.41', flag: false },
      { plate: 'L 1802 NA', car: 'Honda HR-V · Putih', slot: 'B2-03', time: '12.20', flag: true },
      { plate: 'W 5521 KQ', car: 'Mitsubishi Pajero · Abu-abu', slot: 'B1-22', time: '11.58', flag: false },
      { plate: 'AG 77 RT', car: 'Toyota Alphard · Putih', slot: 'VIP-02', time: '11.30', flag: false },
      { plate: 'B 9012 PQR', car: 'BMW 320i · Biru', slot: 'B2-09', time: '10.47', flag: false },
      { plate: 'N 4410 FA', car: 'Suzuki Ertiga · Silver', slot: 'B1-05', time: '10.12', flag: false }
    ];
    const q = this.state.q.replace(/\s/g, '').toUpperCase();
    const list = q ? all.filter((v) => v.plate.replace(/\s/g, '').includes(q)) : all;
    return {
      accent: this.props.accent ?? '#F5C518',
      q: this.state.q,
      typeQ: (e) => this.setState({ q: e.target.value }),
      list,
      count: list.length
    };
  }
}
</script>
</body>
</html>
