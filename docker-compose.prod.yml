# Produksi di VPS Nopol (pola sama dengan nopol-lpr): hanya web & storage yang dibuka, ke 127.0.0.1;
# Caddy (container `caddy`, network host) yang menerima HTTPS. Lihat deploy/README.md.
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
name: ceklis

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ceklis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env.production}
      POSTGRES_DB: ceklis
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceklis"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  storage:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?isi S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?isi S3_SECRET_KEY}
    volumes: [s3data:/data]
    # HP mengunggah foto langsung ke sini (presigned URL) lewat https://ceklis-files.nopol-lpr.com
    ports: ["127.0.0.1:${CEKLIS_FILES_PORT:-9030}:9000"]

  api:
    build: ./apps/api
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://ceklis:${POSTGRES_PASSWORD}@db:5432/ceklis
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://storage:9000
      SESSION_COOKIE_SECURE: "true"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
      storage: { condition: service_started }
    command: sh -c "alembic upgrade head && python -m app.seed --base && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"

  worker:
    build: ./apps/api
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://ceklis:${POSTGRES_PASSWORD}@db:5432/ceklis
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://storage:9000
    depends_on: [api]
    command: arq app.jobs.worker.WorkerSettings

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:8000
    restart: unless-stopped
    depends_on: [api]
    ports: ["127.0.0.1:${CEKLIS_WEB_PORT:-3030}:3000"]

volumes:
  pgdata:
  s3data:
