[project]
name = "ceklis-api"
version = "0.1.0"
description = "API Ceklis — checklist valet"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "arq>=0.28.0",
    "bcrypt>=5.0.0",
    "boto3>=1.43.115",
    "fastapi>=0.150.0",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "pydantic[email]>=2",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.1",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
    "cryptography>=50.0.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Depends/Query/File di default argumen = idiom FastAPI
ignore = ["B008"]
